services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mcpanel
      POSTGRES_PASSWORD: mcpanel
      POSTGRES_DB: mcpanel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpanel"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
