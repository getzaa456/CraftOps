apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mc-panel.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mc-panel.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "mc-panel.fullname" . }}-backend
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            - name: K8S_NAMESPACE
              value: {{ .Values.namespace.servers | quote }}
            - name: PORT_RANGE_MIN
              value: {{ .Values.backend.env.portRangeMin | quote }}
            - name: PORT_RANGE_MAX
              value: {{ .Values.backend.env.portRangeMax | quote }}
            - name: NODE_PORT_OFFSET
              value: {{ .Values.backend.env.nodePortOffset | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "mc-panel.fullname" . }}-secrets
                  key: JWT_SECRET
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mc-panel.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@{{ include "mc-panel.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.backend.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.backend.port }} }
            initialDelaySeconds: 15
            periodSeconds: 20
