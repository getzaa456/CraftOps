global:
  scrape_interval: 10s

scrape_configs:
  - job_name: mc-panel-backend
    static_configs:
      # The backend runs directly on the host (npm run dev / npm start),
      # not as a compose service — host.docker.internal is how the
      # Prometheus container reaches back out to it.
      - targets: ["host.docker.internal:4000"]
